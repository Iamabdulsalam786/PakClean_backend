# Pak Clean – local infrastructure (Phase 1)
# Run: docker compose up -d
# Stop: docker compose down

services:
  db:
    image: postgres:16-alpine
    container_name: pak_clean_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pak_clean
      POSTGRES_PASSWORD: pak_clean_secret
      POSTGRES_DB: pak_clean
    ports:
      - "5432:5432"
    volumes:
      - pak_clean_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pak_clean -d pak_clean"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pak_clean_pgdata:
