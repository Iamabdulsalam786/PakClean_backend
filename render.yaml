# Render Blueprint — PakClean FastAPI backend
# Deploy: Render Dashboard → New → Blueprint → connect this repo

databases:
  - name: pakclean-db
    plan: free
    databaseName: pakclean
    user: pakclean

services:
  - type: web
    name: pakclean-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: pakclean-db
          property: connectionString
