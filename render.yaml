# Render Blueprint — deploy Postgres + FastAPI together.
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push pak-clean-backend to GitHub (this folder = repo root), OR
#      set Root Directory to "pak-clean-backend" if the repo is the parent folder.
#   2. Render Dashboard → New → Blueprint → select the repo
#   3. Apply; set SECRET_KEY if not auto-generated; confirm DATABASE_URL link

databases:
  - name: pak-clean-db
    plan: free
    databaseName: pak_clean
    user: pak_clean

services:
  - type: web
    name: pak-clean-api
    runtime: python
    plan: free
    # Build installs dependencies from requirements.txt
    buildCommand: pip install -r requirements.txt
    # Prefer explicit start (same as Procfile) so PORT is correct on Render
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Run migrations before the new release receives traffic
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Pak Clean API
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      # Strong random secret generated by Render (do not commit a real one)
      - key: SECRET_KEY
        generateValue: true
      # Wired automatically to the Blueprint database above
      - key: DATABASE_URL
        fromDatabase:
          name: pak-clean-db
          property: connectionString
      # Allow your future admin web / Expo web; update after you know the URLs
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:8081,http://127.0.0.1:8081
      # Pin Python for reproducible builds (match your local 3.10 if possible)
      - key: PYTHON_VERSION
        value: "3.10.14"
      # Gmail SMTP — set these in the Render dashboard (do not put real secrets in git)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
