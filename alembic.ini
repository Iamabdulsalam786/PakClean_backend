# Alembic configuration for Pak Clean API
# Docs: https://alembic.sqlalchemy.org/
#
# Common commands (from pak-clean-backend, venv active, Postgres running):
#   alembic revision --autogenerate -m "create users table"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current

[alembic]
# Folder that holds env.py, versions/, and the migration template
script_location = alembic

# Prepend project root to sys.path so "from app..." imports work inside env.py
prepend_sys_path = .

# Default migration file naming; date prefix keeps versions ordered
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long slug part of the filename
truncate_slug_length = 40

# Output verbosity when running alembic commands
verbose = true

# We intentionally leave sqlalchemy.url empty here.
# env.py loads DATABASE_URL from app.core.config (same .env as the API).
# That way credentials are not duplicated or committed in this file.
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Optional: auto-format new revisions later (e.g. ruff/black). Left empty for Phase 1.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
